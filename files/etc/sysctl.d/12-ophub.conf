# Tuning for 1-8 GB arm64 boxes that route / proxy / run docker, with zram swap.

# BBR. Most of the TCP traffic such a box originates is proxy traffic, which is
# exactly where BBR helps. Pacing is done inside BBR since Linux 4.13, so the fq
# qdisc is not needed and fq_codel stays the default (it also does AQM).
# (needs tcp_bbr in the kernel: kmod-tcp-bbr adds /etc/modules.d/*-tcp-bbr)
net.ipv4.tcp_congestion_control=bbr

net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_fin_timeout=30
net.ipv4.tcp_keepalive_time=600

# 4 MB socket buffer ceiling: enough for a gigabit link with a long RTT through
# a proxy, small enough not to matter on 1 GB of RAM.
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_rmem=4096 87380 4194304
net.ipv4.tcp_wmem=4096 65536 4194304
net.core.netdev_max_backlog=4096
net.core.somaxconn=4096

# Conntrack: the default derived from RAM is tight once a proxy and a few docker
# containers hold thousands of flows. 64k entries cost about 20 MB.
net.netfilter.nf_conntrack_max=65536
net.netfilter.nf_conntrack_tcp_timeout_established=3600

# Swap is zram, i.e. RAM. Swapping early is cheaper than reclaiming page cache,
# and zram has no seek cost so reading back one page at a time is the right size.
vm.swappiness=100
vm.page-cluster=0
vm.vfs_cache_pressure=50
