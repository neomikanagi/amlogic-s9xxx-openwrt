#============================================================================================
# Follow upstream (ophub/amlogic-s9xxx-openwrt) except for what this fork changed.
# The rules are in scripts/sync-upstream.sh and .sync/. Weekly, or by hand.
#
# * upstream's tree comes in, our own paths (.sync/own.txt) and dropped ones (.sync/drop.txt)
#   are kept / removed
# * if a file that custom/ patches or the build uses changed, the patches are re-checked at once
#   (an issue is opened when one no longer applies) and a build is started
# Workflow files are ours, never taken from upstream, so the plain GITHUB_TOKEN may push.
#============================================================================================

name: Sync upstream

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      build_after:
        description: "Start a build when the sync changed something the build uses"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        id: sync
        run: bash scripts/sync-upstream.sh --push

      - name: Do the patches in custom/ still apply?
        id: patches
        if: ${{ steps.sync.outputs.changed == 'true' }}
        continue-on-error: true
        run: bash scripts/check-patches.sh

      - name: Open an issue when a patch broke
        if: ${{ steps.patches.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Upstream changed: a patch in custom/ no longer applies" \
            --body "The weekly sync pulled upstream changes and \`scripts/check-patches.sh\` fails (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Builds stop at the same step until \`custom/patches/*.patch\` / \`custom/openwrt_main/stage-rootfs-files.sh\` are re-based on upstream's new file."

      - name: Build when the sync changed something the build uses
        if: ${{ steps.sync.outputs.relevant == 'true' && steps.patches.outcome == 'success' && inputs.build_after != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-openwrt.yml --repo "${GITHUB_REPOSITORY}" --ref main

      # GitHub switches scheduled workflows off after 60 days without repository activity.
      - name: Keep the schedules alive
        run: |
          last="$(git log -1 --format=%ct origin/main)"
          if [[ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]]; then
            git commit --allow-empty -q -m "pi: keepalive (no repository activity for 40 days)"
            git push origin HEAD:main
          fi
